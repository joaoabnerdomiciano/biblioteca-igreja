# Gera o APK do app automaticamente a cada alteração na pasta app/.
# O arquivo fica disponível na aba "Releases" do repositório.
name: Gerar APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/gerar-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivos do Android (se ainda não existirem)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org br.org.igreja --project-name biblioteca .
          fi
          # Firebase exige Android 6.0 (API 23) ou mais novo
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then sed -i -E 's/minSdk( =|Version) flutter\.minSdkVersion/minSdk\1 23/' "$f"; fi
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="biblioteca"/android:label="Biblioteca"/' "$M"
          # Permite abrir links do WhatsApp (Android 11+)
          if ! grep -q 'android:scheme="https"' "$M"; then
            sed -i 's#<queries>#<queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>#' "$M"
          fi
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando a chave salva nos Secrets."
          else
            echo "::warning::Secret KEYSTORE_B64 não configurado. Cada APK sairá com uma assinatura diferente e será preciso desinstalar o app antes de instalar a nova versão. Veja o README."
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/biblioteca.apk

      - uses: actions/upload-artifact@v4
        with:
          name: biblioteca-apk
          path: app/build/biblioteca.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão ${{ github.run_number }}
          body: APK gerado automaticamente. Baixe o arquivo biblioteca.apk no celular e instale.
          files: app/build/biblioteca.apk
